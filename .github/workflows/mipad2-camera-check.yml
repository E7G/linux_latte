name: Mi Pad 2 camera compile check

on:
  push:
    branches:
      - main
      - test/mipad2-camera-20260829
  pull_request:
    paths:
      - 'fix_file/packages/mipad2-camera-support/**'
      - 'fix_file/tests/mipad2-camera-module-order.sh'
      - '.github/workflows/mipad2-camera-check.yml'
  workflow_dispatch:

jobs:
  camera-drivers:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev dwarves

      - name: Configure Mi Pad 2 kernel
        run: make xiaomipad2_defconfig

      - name: Verify camera configuration
        run: |
          grep -E 'CONFIG_VIDEO_(OV5693|T4KA3|DW9719)=' .config
          grep -E 'CONFIG_VIDEO_ATOMISP=' .config
          grep -q '^CONFIG_VIDEO_OV5693=m' .config
          grep -q '^CONFIG_VIDEO_T4KA3=m' .config
          grep -q '^CONFIG_VIDEO_DW9719=m' .config
          grep -q '^CONFIG_VIDEO_ATOMISP=m' .config
          test -s drivers/media/i2c/ov5693.c
          test -s drivers/media/i2c/t4ka3.c
          test -s drivers/media/pci/intel/ipu-bridge.c
          test -s drivers/staging/media/atomisp/pci/atomisp_csi2_bridge.c
          test -s fix_file/packages/mipad2-camera-support/src/intel/ipu/shisp_2401a0_v21.bin
          grep -q 'shisp_2401a0_v21.bin' fix_file/packages/mipad2-camera-support/PKGBUILD
          grep -q 'config VIDEO_T4KA3' drivers/media/i2c/Kconfig
          grep -q 'CONFIG_VIDEO_T4KA3' drivers/media/i2c/Makefile
          grep -q 'IPU_SENSOR_CONFIG("XMCC0003"' drivers/media/pci/intel/ipu-bridge.c
          grep -q '321468000' drivers/media/pci/intel/ipu-bridge.c
          grep -q 'ATOMISP_SENSOR_CONFIG("XMCC0003", 4, true)' drivers/staging/media/atomisp/pci/atomisp_csi2_bridge.c
          grep -q 'ATOMISP_DEFAULT_WIDTH.*1280' drivers/staging/media/atomisp/pci/atomisp_common.h
          grep -q 'ATOMISP_DEFAULT_HEIGHT.*720' drivers/staging/media/atomisp/pci/atomisp_common.h
          grep -q 'fmt.pix.width = ATOMISP_DEFAULT_WIDTH' drivers/staging/media/atomisp/pci/atomisp_fops.c
          grep -q 'fmt.pix.width = ATOMISP_DEFAULT_WIDTH' drivers/staging/media/atomisp/pci/atomisp_ioctl.c
          grep -q 'ret > old_ret' drivers/staging/media/atomisp/pci/hmm/hmm_bo.c
          grep -A4 'atomisp_get_sensor_fps' drivers/staging/media/atomisp/pci/atomisp_cmd.c | \
            grep -q 'V4L2_SUBDEV_FORMAT_ACTIVE'
          grep -q 'devm_regulator_get_optional' drivers/media/i2c/dw9719.c
          grep -q 'mt_is_mipad2_button_keyboard' drivers/hid/hid-multitouch.c
          grep -q 'mt_map_key_clear(KEY_HOME)' drivers/hid/hid-multitouch.c
          grep -q '^CONFIG_USB_DWC3_DUAL_ROLE=y' arch/x86/configs/xiaomipad2_defconfig
          grep -q '^CONFIG_USB_DWC3_PCI=y' arch/x86/configs/xiaomipad2_defconfig
          grep -q '^CONFIG_BT_HCIUART=m' arch/x86/configs/xiaomipad2_defconfig
          grep -q '^CONFIG_BT_BCM=m' arch/x86/configs/xiaomipad2_defconfig
          grep -q '^CONFIG_CFG80211=m' arch/x86/configs/xiaomipad2_defconfig
          grep -q '^CONFIG_BRCMFMAC=m' arch/x86/configs/xiaomipad2_defconfig
          grep -q '^CONFIG_USB_SERIAL_CONSOLE=y' arch/x86/configs/xiaomipad2_defconfig
          grep -q '^CONFIG_USB_CONFIGFS_SERIAL=y' arch/x86/configs/xiaomipad2_defconfig
          grep -q '^CONFIG_USB_CONFIGFS_ACM=y' arch/x86/configs/xiaomipad2_defconfig
          grep -q '^CONFIG_U_SERIAL_CONSOLE=y' arch/x86/configs/xiaomipad2_defconfig
          grep -q '^CONFIG_NLS_CODEPAGE_437=y' arch/x86/configs/xiaomipad2_defconfig
          grep -q '^CONFIG_NLS_ASCII=y' arch/x86/configs/xiaomipad2_defconfig
          grep -q '^CONFIG_CRYPTO_USER=m' arch/x86/configs/xiaomipad2_defconfig
          grep -q '^CONFIG_LOCALVERSION="-mipad2-complete"' arch/x86/configs/xiaomipad2_defconfig

      - name: Compile camera sensor and VCM drivers
        run: |
          make -j"$(nproc)" W=1 \
            drivers/media/pci/intel/ipu-bridge.o \
            drivers/staging/media/atomisp/pci/atomisp_csi2_bridge.o \
            drivers/staging/media/atomisp/pci/atomisp_cmd.o \
            drivers/staging/media/atomisp/pci/atomisp_fops.o \
            drivers/staging/media/atomisp/pci/atomisp_ioctl.o \
            drivers/staging/media/atomisp/pci/hmm/hmm_bo.o \
            drivers/media/i2c/ov5693.o \
            drivers/media/i2c/t4ka3.o \
            drivers/media/i2c/dw9719.o \
            drivers/hid/hid-multitouch.o

      - name: Compile Mi Pad 2 RT5659 and TFA9890 audio drivers
        run: |
          make -j"$(nproc)" W=1 \
            sound/soc/codecs/tfa989x.o \
            sound/soc/intel/boards/cht_bsw_rt5659.o

      - name: Test Mi Pad 2 thermal diagnostics
        run: |
          sh -n fix_file/tests/mipad2-thermal-audit.sh
          sh -n fix_file/tests/mipad2-thermal-audit-selftest.sh
          sh fix_file/tests/mipad2-thermal-audit-selftest.sh
          grep -q '^CONFIG_ACPI_DPTF=y' arch/x86/configs/xiaomipad2_defconfig
          grep -q '^CONFIG_DPTF_POWER=y' arch/x86/configs/xiaomipad2_defconfig
          grep -q '^CONFIG_INT340X_THERMAL=y' arch/x86/configs/xiaomipad2_defconfig
          grep -q '^CONFIG_INTEL_SOC_DTS_THERMAL=y' arch/x86/configs/xiaomipad2_defconfig
          grep -q '^CONFIG_BATTERY_BQ27XXX_I2C=y' .config
          grep -q '^CONFIG_CHARGER_BQ25890=y' arch/x86/configs/xiaomipad2_defconfig
          grep -q '^CONFIG_INTEL_HID_EVENT=y' arch/x86/configs/xiaomipad2_defconfig
          grep -q '"INT33D5"' drivers/platform/x86/intel/hid.c
          grep -q '^CONFIG_INTEL_ISH_HID=y' arch/x86/configs/xiaomipad2_defconfig
          grep -q '^CONFIG_HID_SENSOR_HUB=y' arch/x86/configs/xiaomipad2_defconfig
          grep -q 'PCI_DEVICE_ID_INTEL_ISH_CHV' drivers/hid/intel-ish-hid/ipc/hw-ish.h
          grep -q '^CONFIG_I2C_DESIGNWARE_BAYTRAIL=y' arch/x86/configs/xiaomipad2_defconfig
          grep -q '^CONFIG_SERIAL_8250_DW=y' arch/x86/configs/xiaomipad2_defconfig

      - name: Audit Mi Pad 2 i915 display-power quirk
        run: |
          sh -n fix_file/tests/mipad2-i915-quirk.sh
          sh fix_file/tests/mipad2-i915-quirk.sh
          make -j"$(nproc)" W=1 \
            drivers/gpu/drm/i915/display/intel_display_power.o \
            drivers/gpu/drm/i915/display/intel_display_driver.o \
            drivers/gpu/drm/i915/display/intel_quirks.o

      - name: Audit Mi Pad 2 camera module order
        run: |
          sh -n fix_file/tests/mipad2-camera-module-order.sh
          sh fix_file/tests/mipad2-camera-module-order.sh

      - name: Validate local recovery and USB debug packages
        run: |
          sh -n fix_file/packages/mipad2-recovery/src/mp2-backup
          sh -n fix_file/packages/mipad2-recovery/src/mp2-recover
          sh -n fix_file/packages/mipad2-usb-serial/src/mipad2-usb-serial
          sh -n fix_file/packages/mipad2-test-no-idle/src/mp2-test-no-idle
          sh -n fix_file/tests/mipad2-hardware-smoke.sh
          grep -q 'serial-getty@ttyGS0.service' \
            fix_file/packages/mipad2-usb-serial/src/mipad2-usb-serial.service
          ! grep -R -n -E 'brcmfmac|btbcm|BCM4356|wireless firmware' \
            fix_file/packages/mipad2-usb-serial \
            fix_file/packages/mipad2-recovery \
            fix_file/packages/mipad2-test-no-idle
