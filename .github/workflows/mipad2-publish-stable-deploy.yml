name: Publish Mi Pad 2 stable deployment bundle

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download validated stable-tree artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir artifact
          gh run download 36203387397             --repo "$GITHUB_REPOSITORY"             --name linux-latte-cachyos-navkeys-kernel-bundle             --dir artifact
          cd artifact
          sha256sum -c SHA256SUMS
          test "$(cat commit.txt)" = "361771f0b521b36a48df7773ba09b710445dba80"
          test "$(cat kernelrelease.txt)" = "6.14.0-mipad2-cachyos-navkeys"

      - name: Publish temporary deployment prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: mipad2-stable-final-deploy-20260926
        run: |
          set -euxo pipefail
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create "$TAG"             artifact/vmlinuz-linux-latte-cachyos-navkeys             artifact/modules-linux-latte-cachyos-navkeys.tar.zst             artifact/kernelrelease.txt             artifact/SHA256SUMS             artifact/commit.txt             --repo "$GITHUB_REPOSITORY"             --target 0e97ab471f8366e135d2b1b2b68a79f8b8975e21             --prerelease             --title "Mi Pad 2 stable deployment bundle 2026-09-26"             --notes "Temporary deployment transport for the live-validated stable tree; delete after installation."
