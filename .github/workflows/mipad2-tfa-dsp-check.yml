name: Mi Pad 2 TFA9890 DSP compile check

on:
  push:
    branches:
      - cachyos-mipad2
  pull_request:
    branches:
      - cachyos-mipad2
  workflow_dispatch:

jobs:
  tfa-dsp:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev dwarves
      - name: Configure Mi Pad 2 kernel
        run: |
          make xiaomipad2_defconfig
          sh fix_file/tests/mipad2-kernel-config-audit.sh .config

      - name: Select optional factory DSP driver
        run: |
          scripts/config --disable SND_SOC_TFA989X
          scripts/config --enable SND_SOC_TFA98XX_XIAOMI
          make olddefconfig
          grep -q '^CONFIG_SND_SOC_TFA98XX_XIAOMI=y' .config
          grep -q '^# CONFIG_SND_SOC_TFA989X is not set' .config
      - name: Check TFA DSP lifecycle/error paths
        run: python3 fix_file/tests/mipad2-tfa-dsp-source-test.py
      - name: Compile Xiaomi TFA9890 DSP stack
        run: |
          make -j"$(nproc)" W=1 \
            sound/soc/codecs/tfa98xx-xiaomi/tfa98xx.o \
            sound/soc/codecs/tfa98xx-xiaomi/tfa_container.o \
            sound/soc/codecs/tfa98xx-xiaomi/tfa_dsp.o
