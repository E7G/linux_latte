name: Mi Pad 2 wireless smoke fixture

on:
  pull_request:
    paths:
      - 'fix_file/tests/mipad2-hardware-smoke.sh'
      - 'fix_file/tests/mipad2-wireless-smoke-host-test.py'
      - '.github/workflows/mipad2-wireless-check.yml'
  push:
    branches:
      - codex/mipad2-7.2-integrated
    paths:
      - 'fix_file/tests/mipad2-hardware-smoke.sh'
      - 'fix_file/tests/mipad2-wireless-smoke-host-test.py'
      - '.github/workflows/mipad2-wireless-check.yml'

permissions:
  contents: read

jobs:
  wireless-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /fix_file/tests/mipad2-hardware-smoke.sh
            /fix_file/tests/mipad2-wireless-smoke-host-test.py
      - name: Run wireless fixture with the production smoke helpers
        run: |
          sh -n fix_file/tests/mipad2-hardware-smoke.sh
          python3 fix_file/tests/mipad2-wireless-smoke-host-test.py
          python3 -O fix_file/tests/mipad2-wireless-smoke-host-test.py
