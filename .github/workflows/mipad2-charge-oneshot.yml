name: Build Mi Pad 2 charge one-shot kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev dwarves zstd kmod

      - name: Configure and build isolated test kernel
        run: |
          set -eux
          make xiaomipad2_defconfig
          release="$(make -s LOCALVERSION=-navkeys-charge-test kernelrelease)"
          test "$release" = "6.14.0-mipad2-cachyos-navkeys-charge-test"
          make LOCALVERSION=-navkeys-charge-test -j"$(nproc)" bzImage modules

      - name: Stage bundle
        run: |
          set -eux
          release="$(make -s LOCALVERSION=-navkeys-charge-test kernelrelease)"
          rm -rf modules-root dist
          mkdir -p modules-root dist
          make LOCALVERSION=-navkeys-charge-test INSTALL_MOD_PATH="$PWD/modules-root" modules_install
          rm -f "modules-root/lib/modules/$release/build" "modules-root/lib/modules/$release/source"
          depmod -b "$PWD/modules-root" "$release"
          cp arch/x86/boot/bzImage dist/vmlinuz-linux-latte-charge-test
          cp .config dist/config-linux-latte-charge-test
          printf '%s\n' "$release" > dist/kernelrelease.txt
          git rev-parse HEAD > dist/commit.txt
          tar --zstd -C modules-root/lib/modules -cf dist/modules-linux-latte-charge-test.tar.zst "$release"
          (
            cd dist
            sha256sum vmlinuz-linux-latte-charge-test modules-linux-latte-charge-test.tar.zst > SHA256SUMS
          )

      - uses: actions/upload-artifact@v4
        with:
          name: linux-latte-charge-one-shot
          path: dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
