name: Mi Pad 2 kernel config audit

on:
  pull_request:
    branches: [cachyos-mipad2]
    paths:
      - "arch/x86/configs/xiaomipad2_defconfig"
      - "fix_file/tests/mipad2-kernel-config-audit.sh"
  push:
    branches: [cachyos-mipad2]
    paths:
      - "arch/x86/configs/xiaomipad2_defconfig"
      - "fix_file/tests/mipad2-kernel-config-audit.sh"

permissions:
  contents: read

jobs:
  config-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install Kconfig host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex libssl-dev libelf-dev
      - name: Generate and audit Mi Pad 2 config
        run: |
          make xiaomipad2_defconfig
          sh fix_file/tests/mipad2-kernel-config-audit.sh .config
