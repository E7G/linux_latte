name: Build Mi Pad 2 CachyOS navkeys kernel bundle

on:
  workflow_dispatch:
    inputs:
      localversion_suffix:
        description: "Extra LOCALVERSION suffix for isolated one-shot tests"
        required: false
        default: "-navkeys"
        type: string
  push:
    branches:
      - cachyos-mipad2
    paths:
      - drivers/hid/**
      - arch/x86/configs/xiaomipad2_defconfig
      - .github/workflows/mipad2-bzimage.yml

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MIPAD2_LOCALVERSION: ${{ inputs.localversion_suffix || '-navkeys' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev dwarves zstd kmod

      - name: Configure Mi Pad 2 CachyOS navkeys kernel
        run: |
          make xiaomipad2_defconfig
          release="$(make -s LOCALVERSION="$MIPAD2_LOCALVERSION" kernelrelease)"
          echo "kernelrelease=$release"
          grep '^CONFIG_HID_MULTITOUCH=' .config
          grep '^CONFIG_LOCALVERSION=' .config
          case "$release" in
            6.14.0-mipad2-cachyos*) ;;
            *) echo "Unexpected kernel release: $release" >&2; exit 1 ;;
          esac
          if [ "$MIPAD2_LOCALVERSION" = "-navkeys" ]; then
            test "$release" = "6.14.0-mipad2-cachyos-navkeys"
          fi
          grep -q '^CONFIG_HID_MULTITOUCH=y' .config
          grep -q '^CONFIG_LOCALVERSION="-mipad2-cachyos"' .config

      - name: Build bzImage and modules
        run: |
          make LOCALVERSION="$MIPAD2_LOCALVERSION" -j"$(nproc)" bzImage modules

      - name: Stage matching modules
        run: |
          set -eux
          release="$(make -s LOCALVERSION="$MIPAD2_LOCALVERSION" kernelrelease)"
          rm -rf modules-root
          mkdir -p modules-root
          make LOCALVERSION="$MIPAD2_LOCALVERSION" INSTALL_MOD_PATH="$PWD/modules-root" modules_install
          rm -f "modules-root/lib/modules/$release/build" "modules-root/lib/modules/$release/source"
          depmod -b "$PWD/modules-root" "$release"

          cfg80211="$(find "modules-root/lib/modules/$release" -type f -name 'cfg80211.ko*' | head -n1)"
          brcmfmac="$(find "modules-root/lib/modules/$release" -type f -name 'brcmfmac.ko*' | head -n1)"
          test -n "$cfg80211"
          test -n "$brcmfmac"
          test "$(modinfo -F vermagic "$cfg80211" | awk '{print $1}')" = "$release"
          test "$(modinfo -F vermagic "$brcmfmac" | awk '{print $1}')" = "$release"

          {
            echo "cfg80211: $(modinfo -F vermagic "$cfg80211")"
            echo "brcmfmac: $(modinfo -F vermagic "$brcmfmac")"
          } | tee module-vermagic.txt

      - name: Prepare kernel bundle
        run: |
          set -eux
          release="$(make -s LOCALVERSION="$MIPAD2_LOCALVERSION" kernelrelease)"
          mkdir -p dist
          cp arch/x86/boot/bzImage dist/vmlinuz-linux-latte-cachyos-navkeys
          cp .config dist/config-linux-latte-cachyos-navkeys
          printf '%s\n' "$release" > dist/kernelrelease.txt
          git rev-parse HEAD > dist/commit.txt
          cp module-vermagic.txt dist/module-vermagic.txt
          tar --zstd -C modules-root/lib/modules -cf dist/modules-linux-latte-cachyos-navkeys.tar.zst "$release"
          (
            cd dist
            sha256sum \
              vmlinuz-linux-latte-cachyos-navkeys \
              modules-linux-latte-cachyos-navkeys.tar.zst > SHA256SUMS
          )
          ls -lh dist
          cat dist/kernelrelease.txt
          cat dist/module-vermagic.txt
          cat dist/SHA256SUMS

      - name: Upload kernel bundle
        uses: actions/upload-artifact@v4
        with:
          name: linux-latte-cachyos-navkeys-kernel-bundle
          path: dist/
          if-no-files-found: error
          retention-days: 14
