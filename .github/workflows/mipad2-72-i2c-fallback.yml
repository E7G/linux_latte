name: Mi Pad 2 7.2 I2C fallback ownership

on:
  workflow_dispatch:
  push:
    branches: [fix/mipad2-72-i2c-fallback-irq, codex/mipad2-7.2-integrated]
    paths:
      - drivers/platform/x86/x86-android-tablets/core.c
      - fix_file/tests/mipad2-i2c-fallback-host-test.py
      - .github/workflows/mipad2-72-i2c-fallback.yml
  pull_request:
    branches: [codex/mipad2-7.2-integrated]
    paths:
      - drivers/platform/x86/x86-android-tablets/core.c
      - fix_file/tests/mipad2-i2c-fallback-host-test.py
      - .github/workflows/mipad2-72-i2c-fallback.yml

permissions:
  contents: read

jobs:
  i2c-fallback:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install 7.2 kernel build dependencies
        run: |
          apt_sources=(-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-)
          sudo apt-get "${apt_sources[@]}" update
          sudo apt-get "${apt_sources[@]}" install -y build-essential clang llvm lld bc bison flex libssl-dev libelf-dev
      - name: Exercise ACPI-owned and DMI fallback enumeration
        run: |
          CC="gcc -fsanitize=undefined -fno-sanitize-recover=all" python3 -B fix_file/tests/mipad2-i2c-fallback-host-test.py
          CC="clang -fsanitize=undefined -fsanitize-trap=undefined" python3 -B -O fix_file/tests/mipad2-i2c-fallback-host-test.py
      - name: Compile the built-in I2C tablet core with the Mi Pad 2 configuration
        run: |
          out="$RUNNER_TEMP/mipad2-fallback"
          make O="$out" ARCH=x86_64 LLVM=1 xiaomipad2_defconfig
          case "$(make -s O="$out" ARCH=x86_64 LLVM=1 kernelversion)" in 7.2.*) ;; *) exit 1;; esac
          grep -qx 'CONFIG_X86_ANDROID_TABLETS=y' "$out/.config"
          make O="$out" ARCH=x86_64 LLVM=1 W=1 -j"$(nproc)" drivers/platform/x86/x86-android-tablets/core.o
          test -s "$out/drivers/platform/x86/x86-android-tablets/core.o"
