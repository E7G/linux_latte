# A partial or contradictory backend is a configuration error; loading
# the verb must fail before it can write any mixers.
If.LeftMusic {
    Condition {
        Type ControlExists
        Control "name='Left Profile'"
        ControlEnum "musicL"
    }
    False.Error "Mi Pad 2: missing left factory music profile"
}

If.RightMusic {
    Condition {
        Type ControlExists
        Control "name='Right Profile'"
        ControlEnum "musicR"
    }
    False.Error "Mi Pad 2: missing right factory music profile"
}

If.LeftStop {
    Condition {
        Type ControlExists
        Control "name='Left Stop'"
    }
    False.Error "Mi Pad 2: incomplete factory DSP amplifier pair"
}

If.RightStop {
    Condition {
        Type ControlExists
        Control "name='Right Stop'"
    }
    False.Error "Mi Pad 2: incomplete factory DSP amplifier pair"
}

If.ModernLeftBypass {
    Condition {
        Type ControlExists
        Control "name='Left Amp Input'"
    }
    True.Error "Mi Pad 2: mixed factory DSP and bypass amplifier controls"
}

If.ModernRightBypass {
    Condition {
        Type ControlExists
        Control "name='Right Amp Input'"
    }
    True.Error "Mi Pad 2: mixed factory DSP and bypass amplifier controls"
}

If.LegacyLeftBypass {
    Condition {
        Type ControlExists
        Control "name='Amp Input'"
    }
    True.Error "Mi Pad 2: mixed factory DSP and bypass amplifier controls"
}

If.LegacyRightBypass {
    Condition {
        Type ControlExists
        Control "name='Amp Input1'"
    }
    True.Error "Mi Pad 2: mixed factory DSP and bypass amplifier controls"
}

Define.MiPad2AmpBackend "factory"
