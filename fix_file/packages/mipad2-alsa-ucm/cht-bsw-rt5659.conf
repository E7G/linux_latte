Syntax 3

Define.MiPad2AmpBackend "bypass"

# The two kernel backends are mutually exclusive. Once any DSP profile
# control exists, never fall through to the bypass topology.
If.FactoryAmps {
    Condition {
        Type ControlExists
        Control "name='Left Profile'"
    }
    True.Include.factory.File "FactoryAmplifiers.conf"
    False.If.OrphanFactoryRight {
        Condition {
            Type ControlExists
            Control "name='Right Profile'"
        }
        True.Error "Mi Pad 2: incomplete factory DSP amplifier pair"
        False.Include.bypass.File "BypassAmplifiers.conf"
    }
}

SectionUseCase."HiFi" {
    File "HiFi.conf"
    Comment "Mi Pad 2 RT5659 with dual TFA9890 speakers"
}
