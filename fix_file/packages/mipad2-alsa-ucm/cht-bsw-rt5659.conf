Syntax 3

# Select a complete stereo pair before any verb/device sequence writes mixers.
# A partial or unknown layout is a probe/configuration error, not a reason to
# guess a channel or enable only one amplifier.
If.ModernAmplifiers {
    Condition {
        Type ControlExists
        Control "name='Left Amp Input'"
    }
    True {
        If.ModernRight {
            Condition {
                Type ControlExists
                Control "name='Right Amp Input'"
            }
            True {
                Define.LeftAmpControl "Left Amp Input"
                Define.RightAmpControl "Right Amp Input"
            }
            False {
                Error "Mi Pad 2: incomplete prefixed amplifier pair"
            }
        }
    }
    False {
        If.OrphanModernRight {
            Condition {
                Type ControlExists
                Control "name='Right Amp Input'"
            }
            True {
                Error "Mi Pad 2: incomplete prefixed amplifier pair"
            }
            False {
                If.LegacyLeft {
                    Condition {
                        Type ControlExists
                        Control "name='Amp Input'"
                    }
                    True {
                        If.LegacyRight {
                            Condition {
                                Type ControlExists
                                Control "name='Amp Input1'"
                            }
                            True {
                                Define.LeftAmpControl "Amp Input"
                                Define.RightAmpControl "Amp Input1"
                            }
                            False {
                                Error "Mi Pad 2: incomplete legacy amplifier pair"
                            }
                        }
                    }
                    False {
                        Error "Mi Pad 2: no supported stereo amplifier controls"
                    }
                }
            }
        }
    }
}

SectionUseCase."HiFi" {
    File "HiFi.conf"
    Comment "Mi Pad 2 RT5659 with dual TFA9890 speakers"
}
